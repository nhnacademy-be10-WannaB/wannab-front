spring:
  application:
    name: front-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    hidden method:
      filter:
        enabled: true
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false
  openfeign:
    client:
      config:
        gateway:
          url: ${gateway.api.url}
  security:
    oauth2:
      client:
        registration:
          payco:
            client-id: secret
            client-secret: secret
            redirect-uri: "https://97d9-220-67-222-150.ngrok-free.app/login/oauth2/code/payco"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - idNo
              - email
              - mobile
              - name
              - birth
            client-name: payco
            provider: payco

        provider:
          payco:
            authorization-uri: https://id.payco.com/oauth2.0/authorize
            token-uri: https://id.payco.com/oauth2.0/token
            user-info-uri: https://apis-payco.krp.toastoven.net/payco/friends/find_member_v2.json
            user-name-attribute: idNo
eureka:
  client:
    enabled: false

server:
  port: 10384

# user-service
jwt:
  secret-key: secret

toss:
  payments:
    clientKey: secret

# Gateway
gateway:
  api:
    url: ""

# User
user:
  api:
    url: ""

# Order Payment
order:
  api:
    url: ""

# Book
book:
  api:
    url: ""

# Coupon
coupon:
  api:
    url: ""