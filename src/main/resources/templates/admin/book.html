<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout (
      ~{::div}
    )}">


<div>
    <div class="bg-white p-6 rounded-xl shadow-md">
        <div class="flex justify-between">
            <div class="flex items-center">
                <h2 class="text-2xl font-bold text-sky-700">도서 관리</h2>

                <!-- 정렬 기준 버튼 -->
                <button id="dropdownDefaultButton"
                        data-dropdown-toggle="dropdown"
                        class="bg-sky-100 hover:bg-sky-300 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center inline-flex items-center ml-3"
                        type="button">
                    <span class="text-sky-700" th:text="${sortName}"></span>
                    <svg class="w-2.5 h-2.5 ms-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/>
                    </svg>
                </button>
            </div>

            <!-- 드롭다운 메뉴 -->
            <div id="dropdown" class="z-10 hidden bg-blue-100 divide-y divide-gray-100 rounded-lg shadow-sm w-44">
                <ul class="py-2 text-sm text-sky-700" aria-labelledby="dropdownDefaultButton">

                    <!-- 이름순 -->
                    <li>
                        <button id="doubleDropdownButton1" data-dropdown-toggle="doubleDropdown1" type="button"
                                data-dropdown-placement="right-start"
                                class="flex items-center justify-between w-full px-4 py-2 hover:bg-sky-300">
                            이름순
                            <svg class="w-2.5 h-2.5 ms-3 rtl:rotate-180" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                            </svg>
                        </button>
                        <div id="doubleDropdown1" class="z-10 hidden bg-blue-100  divide-y divide-gray-100 rounded-lg shadow-sm w-44">
                            <ul class="py-2 text-sm text-sky-700">
                                <li><a href="/admin/books?sort=title,asc" class="block px-4 py-2 hover:bg-sky-300">오름차순</a></li>
                                <li><a href="/admin/books?sort=title,desc" class="block px-4 py-2 hover:bg-sky-300">내림차순</a></li>
                            </ul>
                        </div>
                    </li>

                    <!-- 가격순 -->
                    <li>
                        <button id="doubleDropdownButton2" data-dropdown-toggle="doubleDropdown2" type="button"
                                data-dropdown-placement="right-start"
                                class="flex items-center justify-between w-full px-4 py-2 hover:bg-sky-300">
                            가격순
                            <svg class="w-2.5 h-2.5 ms-3 rtl:rotate-180" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                            </svg>
                        </button>
                        <div id="doubleDropdown2" class="z-10 hidden bg-blue-100 divide-y divide-gray-100 rounded-lg shadow-sm w-44">
                            <ul class="py-2 text-sm text-sky-700">
                                <li><a href="/admin/books?sort=originPrice,asc" class="block px-4 py-2 hover:bg-sky-300">오름차순</a></li>
                                <li><a href="/admin/books?sort=originPrice,desc" class="block px-4 py-2 hover:bg-sky-300">내림차순</a></li>
                            </ul>
                        </div>
                    </li>

                    <!-- 최신순 -->
                    <li>
                        <button id="doubleDropdownButton3" data-dropdown-toggle="doubleDropdown3" type="button"
                                data-dropdown-placement="right-start"
                                class="flex items-center justify-between w-full px-4 py-2 hover:bg-sky-300">
                            출간일
                            <svg class="w-2.5 h-2.5 ms-3 rtl:rotate-180" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                            </svg>
                        </button>
                        <div id="doubleDropdown3" class="z-10 hidden bg-blue-100 divide-y divide-gray-100 rounded-lg shadow-sm w-44">
                            <ul class="py-2 text-sm text-sky-700">
                                <li><a href="/admin/books?sort=publicationDate,desc" class="block px-4 py-2 hover:bg-sky-300">최신순</a></li>
                                <li><a href="/admin/books?sort=publicationDate,asc" class="block px-4 py-2 hover:bg-sky-300">오래된순</a></li>
                            </ul>
                        </div>
                    </li>

                    <!-- 재고순 -->
                    <li>
                        <button id="doubleDropdownButton4" data-dropdown-toggle="doubleDropdown4" type="button"
                                data-dropdown-placement="right-start"
                                class="flex items-center justify-between w-full px-4 py-2 hover:bg-sky-300">
                            재고순
                            <svg class="w-2.5 h-2.5 ms-3 rtl:rotate-180" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
                            </svg>
                        </button>
                        <div id="doubleDropdown4" class="z-10 hidden bg-blue-100 divide-y divide-gray-100 rounded-lg shadow-sm w-44">
                            <ul class="py-2 text-sm text-sky-700">
                                <li><a href="/admin/books?sort=stock,desc" class="block px-4 py-2 hover:bg-sky-300">내림차순</a></li>
                                <li><a href="/admin/books?sort=stock,asc" class="block px-4 py-2 hover:bg-sky-300">오름차순</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>


            <div class="flex space-x-2">
                <button type="button"
                        data-modal-target="category-add-modal"
                        data-modal-toggle="category-add-modal"
                        class="block text-sky-700 bg-sky-100 hover:bg-sky-300 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center">
                    카테고리 추가
                </button>
                <button data-modal-target="default-modal" data-modal-toggle="default-modal"
                        class="block text-sky-700 bg-sky-100 hover:bg-sky-300 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center"
                        type="button"
                        th:onclick="|window.location.href='@{/admin/books/new}'|"
                        >
                    일반 도서 추가
                </button>
                <a href="/admin/books/aladin"
                        class="block text-sky-700 bg-sky-100 hover:bg-sky-300 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center"
                        type="button">
                    알라딘 도서 추가
                </a>
            </div>
        </div>




        <!-- 도서 목록 테이블 -->
        <div class="overflow-x-auto mt-6">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-sky-100">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">썸네일
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">도서명
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">카테고리
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">작가
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">출판사
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">출판일
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">ISBN
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">가격
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">재고
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">상태
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">관리
                    </th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-100">
                <tr th:each="book : ${books}" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-4">
                        <img th:src="${#lists.isEmpty(book.imageUrls) ? '/static_images/testbook.png' : book.imageUrls[0]}"
                             alt="책 이미지"
                             class="w-[100px] h-[140px] object-cover" />
                    </td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.title}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${#strings.listJoin(book.tagNames, '\n ')}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${#strings.listJoin(book.authorNames, '\n ')}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${#strings.listJoin(book.publisherNames, '\n ')}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.publicationDate}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.isbn}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.originPrice} + '원'"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.stock}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.status}"></td>
                    <td class="px-4 py-4 text-sm">
                        <button type="button" th:data-modal-target="'editBookModal-' + ${book.bookId}"
                                th:data-modal-toggle="'editBookModal-' + ${book.bookId}"
                                th:onclick="|window.location.href='@{/admin/books/update/{bookId}(bookId=${book.bookId})}'|"
                                class="text-sky-600 hover:underline mr-2">
                            수정
                        </button>
                        <form th:action="@{'/admin/books/delete/' + ${book.bookId}}" method="post"
                              onsubmit="return confirm('삭제하시겠습니까?');">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="text-red-500 hover:underline">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <!-- 페이지 네이션용 -->
        <nav aria-label="Page navigation">
            <th:block th:if="${totalPages != null}">
                <ul class="flex justify-center mt-6 space-x-2" th:if="${totalPages > 0}">

                    <!-- 이전 페이지 -->
                    <li>
                        <span th:if="${currentPage == 0}" class="px-3 py-1 text-gray-400">&laquo;</span>
                        <a th:if="${currentPage > 0}" th:href="@{/admin/books(page=${prevPage}, size=${size})}"
                           class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 transition">
                            &laquo;
                        </a>
                    </li>

                    <!-- 페이지 번호 제한 범위 -->
                    <li th:each="pageNum : ${#numbers.sequence(startPage, endPage)}">
                        <a th:href="@{/admin/books(page=${pageNum}, size=${size})}"
                           th:text="${pageNum + 1}"
                           th:classappend="${pageNum == currentPage} ? 'bg-sky-100 text-sky-700 font-semibold' : 'bg-gray-200' "
                           class="px-3 py-1 rounded hover:bg-gray-300 transition">
                        </a>
                    </li>

                    <!-- 다음 페이지 -->
                    <li th:if="${currentPage < totalPages - 1}">
                        <a th:href="@{/admin/books(page=${nextPage}, size=${size})}"
                           class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 transition">
                            &raquo;
                        </a>
                    </li>
                    <li th:unless="${currentPage < totalPages - 1}">
                        <span class="px-3 py-1 text-gray-400">&raquo;</span>
                    </li>
                </ul>
            </th:block>
        </nav>

    </div>
    <div id="category-add-modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
            <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                        신규 카테고리 추가
                    </h3>
                    <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white" data-modal-hide="category-add-modal">
                        <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                        </svg>
                        <span class="sr-only">Close modal</span>
                    </button>
                </div>
                <form th:action="@{/admin/categories/new}" method="post" class="p-4 md:p-5">
                    <div class="grid gap-4 mb-4 grid-cols-1">
                        <div>
                            <label for="parent-category" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">1차 카테고리 (상위)</label>

                            <select id="parent-category" name="parentId" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
                                <option selected value="">없음 (최상위 카테고리로 등록)</option>

                                <option th:each="parent : ${parentCategories}"
                                        th:value="${parent.id}"
                                        th:text="${parent.name}">
                                </option>
                            </select>
                        </div>
                        <div>
                            <label for="category-name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">2차 카테고리명 (하위)</label>
                            <input type="text" name="name" id="category-name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-600 dark:focus:border-primary-600" placeholder="카테고리 이름을 입력하세요" required>
                        </div>
                    </div>
                    <button type="submit" class="text-white inline-flex items-center bg-sky-600 hover:bg-sky-700 focus:ring-4 focus:outline-none focus:ring-sky-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                        저장하기
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
