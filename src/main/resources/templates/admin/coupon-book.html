<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout (
      ~{::div}
    )}">


<div>
    <div class="bg-white p-6 rounded-xl shadow-md">
        <div class="flex justify-between items-start">
            <h2 class="text-2xl font-bold text-sky-700">도서 쿠폰 관리</h2>

            <div class="w-1/2 flex flex-col space-y-2">
                <h3 class="text-xl font-bold text-sky-700">도서 검색</h3>
                <form th:action="@{/admin/coupons/books}" method="get" class="flex space-x-2">
                    <input type="text" name="keyword" th:value="${keyword}"
                           placeholder="도서 검색"
                           class="border rounded px-3 py-1 text-sm flex-1" />
                    <button type="submit" class="bg-sky-500 text-white px-4 py-1 rounded text-sm hover:bg-sky-600">
                        검색
                    </button>
                </form>
            </div>
        </div>

        <!-- 도서 목록 테이블 -->
        <div class="overflow-x-auto mt-6">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-sky-100">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">썸네일
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">도서명
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">카테고리
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">작가
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">출판사
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">출판일
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">ISBN
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">가격
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">재고
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">상태
                    </th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">쿠폰등록
                    </th>
                </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-100">
                <tr th:each="book : ${books}" class="hover:bg-gray-50 transition">
                    <td class="px-4 py-4">
                        <img th:src="${#lists.isEmpty(book.imageUrls) ? '/static_images/testbook.png' : book.imageUrls[0]}"
                             alt="책 이미지"
                             class="w-[100px] h-[140px] object-cover" />
                    </td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.title}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${#strings.listJoin(book.tagNames, '\n ')}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${#strings.listJoin(book.authorNames, '\n ')}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${#strings.listJoin(book.publisherNames, '\n ')}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.publicationDate}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.isbn}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.originPrice} + '원'"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.stock}"></td>
                    <td class="px-4 py-4 text-gray-800 text-sm" th:text="${book.status}"></td>
                    <td class="px-4 py-4 text-sm">
                        <form th:action="@{/admin/coupons/books/{bookId}(bookId=${book.bookId})}" method="post">
                            <input type="hidden" name="keyword" th:value="${keyword}" />
                            <input type="hidden" name="bookTitle" th:value="${book.title}" />
                            <button type="submit" class="bg-sky-500 text-white px-3 py-1 rounded text-xs hover:bg-sky-600">
                                등록
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이지 네이션용 -->
        <nav aria-label="Page navigation">
            <th:block th:if="${totalPages != null}">
                <ul class="flex justify-center mt-6 space-x-2" th:if="${totalPages > 0}">

                    <!-- 이전 페이지 -->
                    <li>
                        <span th:if="${currentPage == 0}" class="px-3 py-1 text-gray-400">&laquo;</span>
                        <a th:if="${currentPage > 0}" th:href="@{/admin/coupons/books(page=${prevPage}, size=${size})}"
                           class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 transition">
                            &laquo;
                        </a>
                    </li>

                    <!-- 페이지 번호 제한 범위 -->
                    <li th:each="pageNum : ${#numbers.sequence(startPage, endPage)}">
                        <a th:href="@{/admin/coupons/books(page=${pageNum}, size=${size})}"
                           th:text="${pageNum + 1}"
                           th:classappend="${pageNum == currentPage} ? 'bg-sky-100 text-sky-700 font-semibold' : 'bg-gray-200' "
                           class="px-3 py-1 rounded hover:bg-gray-300 transition">
                        </a>
                    </li>

                    <!-- 다음 페이지 -->
                    <li th:if="${currentPage < totalPages - 1}">
                        <a th:href="@{/admin/coupons/books(page=${nextPage}, size=${size})}"
                           class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 transition">
                            &raquo;
                        </a>
                    </li>
                    <li th:unless="${currentPage < totalPages - 1}">
                        <span class="px-3 py-1 text-gray-400">&raquo;</span>
                    </li>
                </ul>
            </th:block>
        </nav>
    </div>
    <div id="modal-book-coupon" tabindex="-1" aria-hidden="true"
         class="hidden fixed top-0 left-0 right-0 z-50 justify-center items-center w-full p-4 overflow-x-hidden overflow-y-auto md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative w-full max-w-2xl max-h-full">
            <div class="relative bg-white rounded-lg shadow-md border border-sky-100">

                <div class="flex items-center justify-between p-4 border-b border-gray-200 rounded-t">
                    <h3 class="text-xl font-semibold text-sky-700">도서 쿠폰 정보 입력</h3>
                    <button type="button"
                            class="text-gray-400 hover:bg-gray-100 hover:text-gray-700 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
                            data-modal-hide="modal-book-coupon">
                        <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                  stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                        </svg>
                    </button>
                </div>

                <form th:action="@{/admin/coupons}" th:object="${couponPolicyCreateDto}" method="post" class="p-4 space-y-4">
                    <input type="hidden" name="couponType" value="BOOK" />
                    <input type="hidden" th:field="*{targetBookId}" />

                    <div>
                        <label class="block mb-1 font-medium">적용 도서</label>
                        <div id="selectedBookDisplay" class="w-full border p-2 rounded-lg bg-gray-100">
                        </div>
                    </div>

                    <div>
                        <label class="block mb-1 font-medium">정책명</label>
                        <input type="text" th:field="*{name}" required class="w-full border p-2 rounded-lg" />
                    </div>

                    <div>
                        <label class="block mb-1 font-medium">할인 유형</label>
                        <select th:field="*{discountType}" class="w-full border p-2 rounded-lg">
                            <option value="FIXED">정액 할인</option>
                            <option value="PERCENT">정률 할인</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block mb-1 font-medium">할인 금액 또는 비율</label>
                            <input type="number" th:field="*{discountValue}" required class="w-full border p-2 rounded-lg" />
                        </div>
                        <div>
                            <label class="block mb-1 font-medium">최대 할인 한도 (정률)</label>
                            <input type="number" th:field="*{maxDiscount}" class="w-full border p-2 rounded-lg" />
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block mb-1 font-medium">시작일</label>
                            <input type="date" th:field="*{startDate}" class="w-full border p-2 rounded-lg" />
                        </div>
                        <div>
                            <label class="block mb-1 font-medium">종료일</label>
                            <input type="date" th:field="*{endDate}" class="w-full border p-2 rounded-lg" />
                        </div>
                    </div>


                    <div class="flex justify-end pt-4 border-t border-gray-200 gap-2">
                        <button type="submit"
                                class="text-white bg-sky-500 hover:bg-sky-600 font-medium rounded-lg text-sm px-5 py-2.5">
                            저장
                        </button>
                        <button type="button"
                                class="px-5 py-2.5 text-sm font-medium text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-100"
                                data-modal-hide="modal-book-coupon">
                            취소
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            // --- 기존 모달 열기 로직 (그대로 둡니다) ---
            const urlParams = new URLSearchParams(window.location.search);
            const showModal = urlParams.get('showModal') === 'true';

            /*<![CDATA[*/
            if (showModal) {
                const bookTitle = /*[[${selectedBookTitle}]]*/ '';
                const displayDiv = document.getElementById('selectedBookDisplay');
                if (displayDiv) {
                    displayDiv.innerHTML = `<p class="font-semibold">${bookTitle}</p>`;
                }

                const modal = document.getElementById('modal-book-coupon');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
            /*]]>*/


            // --- ✅ [추가] 모달 닫기 로직 ---
            // 'data-modal-hide' 속성을 가진 모든 요소를 찾습니다. (X 버튼, 취소 버튼)
            const closeButtons = document.querySelectorAll('[data-modal-hide]');

            closeButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // data-modal-hide 속성 값으로 지정된 모달 ID를 가져옵니다 (예: "modal-book-coupon")
                    const modalId = button.getAttribute('data-modal-hide');
                    const modalToHide = document.getElementById(modalId);

                    if (modalToHide) {
                        // 해당 모달을 숨깁니다.
                        modalToHide.classList.add('hidden');
                        modalToHide.classList.remove('flex');
                    }
                });
            });
        });
    </script>
</div>
