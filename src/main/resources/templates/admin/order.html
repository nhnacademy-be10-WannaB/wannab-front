<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout (
      ~{::div}
    )}">
<div>
  <div class="bg-white p-6 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold text-sky-700 mb-4">주문 관리</h2>

    <!-- 메시지 알림 -->
    <div th:if="${message}" class="mb-4 p-3 rounded-md bg-green-100 text-green-800 text-sm font-medium">
      <span th:text="${message}"></span>
    </div>

    <!-- 검색 폼 -->
    <form th:action="@{/admin/order}" method="get" class="mb-6 flex flex-wrap gap-4 items-end">
      <div>
        <label for="orderId" class="block text-sm font-medium text-gray-700">주문번호</label>
        <input type="text" id="orderId" name="orderId" th:value="${orderId}"
               class="mt-1 px-3 py-2 border rounded w-40 text-sm" placeholder="주문번호" />
      </div>

      <div>
        <label for="orderName" class="block text-sm font-medium text-gray-700">주문명</label>
        <input type="text" id="orderName" name="orderName" th:value="${orderName}"
               class="mt-1 px-3 py-2 border rounded w-40 text-sm" placeholder="주문명" />
      </div>

      <div>
        <label for="orderStatus" class="block text-sm font-medium text-gray-700">상태</label>
        <select id="orderStatus" name="orderStatus" class="mt-1 px-3 py-2 border rounded w-36 text-sm">
          <option value="">전체</option>
          <option value="PENDING" th:selected="${orderStatus == 'PENDING'}">대기</option>
          <option value="SHIPPING" th:selected="${orderStatus == 'SHIPPING'}">배송중</option>
          <option value="COMPLETED" th:selected="${orderStatus == 'COMPLETED'}">배송 완료</option>
          <option value="RETURNED" th:selected="${orderStatus == 'RETURNED'}">반품</option>
          <option value="CANCELLED" th:selected="${orderStatus == 'CANCELLED'}">주문취소</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">주문일자</label>
        <div class="flex gap-2">
          <input type="date" name="from" th:value="${from}" class="px-3 py-2 border rounded text-sm" />
          <span class="text-sm">~</span>
          <input type="date" name="to" th:value="${to}" class="px-3 py-2 border rounded text-sm" />
        </div>
      </div>

      <div>
        <button type="submit" class="mt-1 px-4 py-2 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">
          검색
        </button>
      </div>
    </form>


    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-sky-100">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">주문번호</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">주문명</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">주문일시</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">출고일시</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">총금액</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">상태</th>
          <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">변경</th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-100">
        <tr th:each="order : ${orders}" class="hover:bg-gray-50 transition">
          <td class="px-6 py-4 text-sm text-gray-800" th:text="${order.orderId}">주문번호</td>
          <td class="px-6 py-4 text-sm text-gray-800" th:text="${order.orderName}">주문명</td>
          <td class="px-6 py-4 text-sm text-gray-800" th:text="${#temporals.format(order.orderAt, 'yyyy-MM-dd HH:mm')}">주문일시</td>
          <td class="px-6 py-4 text-sm text-gray-800" th:text="${#temporals.format(order.shippedAt, 'yyyy-MM-dd HH:mm')}">출고일시</td>
          <td class="px-6 py-4 text-sm text-gray-800" th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'">총금액</td>
          <td class="px-6 py-4 text-sm font-semibold"
              th:with="status=${order.orderStatus != null ? order.orderStatus.name() : 'PENDING'}"
              th:switch="${status}">
            <span th:case="'PENDING'" class="text-gray-500">대기</span>
            <span th:case="'SHIPPING'" class="text-green-500">배송중</span>
            <span th:case="'COMPLETED'" class="text-black">배송 완료</span>
            <span th:case="'RETURNED'" class="text-red-500">반품</span>
            <span th:case="'CANCELLED'" class="text-orange-500">주문취소</span>
            <span th:case="*" class="text-yellow-500">알 수 없음</span>
          </td>
          <td class="px-6 py-4">
            <form th:action="@{/admin/order/status/update}" method="post" class="flex items-center gap-2">
              <input type="hidden" name="orderId" th:value="${order.orderId}" />
              <select name="newStatus" class="p-1 w-28 text-sm border rounded">
                <option value="PENDING" th:selected="${order.orderStatus.name() == 'PENDING'}">대기</option>
                <option value="SHIPPING" th:selected="${order.orderStatus.name() == 'SHIPPING'}">배송중</option>
                <option value="COMPLETED" th:selected="${order.orderStatus.name() == 'COMPLETED'}">배송 완료</option>
              </select>
              <button type="submit"
                      class="bg-sky-500 hover:bg-sky-600 text-white text-sm px-3 py-1 rounded">
                변경
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>



  <!-- 페이징 -->
  <div class="mt-6 flex justify-center" th:if="${page.totalPages > 1}">
    <nav class="inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
      <a th:href="@{/admin/order(page=${page.number - 1}, size=${page.size},
                          orderId=${orderId}, orderName=${orderName},
                          orderStatus=${orderStatus}, from=${from}, to=${to})}"
         th:if="${!page.first}"
         class="px-3 py-2 border border-gray-300 bg-white text-sm text-gray-500 hover:bg-gray-50">
        이전
      </a>

      <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
         th:href="@{/admin/order(page=${i}, size=${page.size},
                   orderId=${orderId}, orderName=${orderName},
                   orderStatus=${orderStatus}, from=${from}, to=${to})}"
         th:text="${i + 1}"
         th:classappend="${i == page.number} ? 'bg-blue-500 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
         class="px-3 py-2 border border-gray-300 text-sm">
      </a>

      <a th:href="@{/admin/order(page=${page.number + 1}, size=${page.size},
                          orderId=${orderId}, orderName=${orderName},
                          orderStatus=${orderStatus}, from=${from}, to=${to})}"
         th:if="${!page.last}"
         class="px-3 py-2 border border-gray-300 bg-white text-sm text-gray-500 hover:bg-gray-50">
        다음
      </a>
    </nav>
  </div>
</div>
