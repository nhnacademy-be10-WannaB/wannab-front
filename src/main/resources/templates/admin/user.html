<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: layout (
      ~{::div}
    )}">


<div>
  <div class="bg-white p-6 rounded-xl shadow-md">
    <div class="flex justify-between">
      <div class="flex items-center">
        <h2 class="text-2xl font-bold text-sky-700">유저 관리</h2>
      </div>
<!--      <div class="flex space-x-2">-->
<!--        <a href="/admin/user/new"-->
<!--           class="block text-sky-700 bg-sky-100 hover:bg-sky-300 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center"-->
<!--           type="button">-->
<!--          유저 추가-->
<!--        </a>-->
<!--      </div>-->
    </div>
    <!-- 유저 목록 테이블 -->
    <div class="overflow-x-auto mt-6">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-sky-100">
        <tr>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">이름
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">닉네임
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">이메일
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">연락처
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">생일
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">아이디
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">권한
          </th>
          <th class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase">관리
          </th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-100">
        <tr class="hover:bg-gray-50 transition" th:each="user : ${userList}">
          <td class="px-4 py-4 text-gray-800 text-sm" th:text="${user.name}">이름</td>
          <td class="px-4 py-4 text-gray-800 text-sm" th:text="${user.nickname}">닉네임</td>
          <td class="px-4 py-4 text-gray-800 text-sm" th:text="${user.email}">이메일</td>
          <td class="px-4 py-4 text-gray-800 text-sm" th:text="${user.phone}">연락처</td>
          <td class="px-4 py-4 text-gray-800 text-sm" th:text="${user.birth}">생일</td>
          <td class="px-4 py-4 text-gray-800 text-sm" th:text="${user.username}">아이디</td>
          <td class="px-4 py-4 text-gray-800 text-sm" th:text="${user.role}">권한</td>
          <td class="px-4 py-4 text-sm">
            <button th:onclick="|window.location.href='@{/admin/users/update/{loginId}(loginId=${user.username})}'|"
                    class="text-sky-600 hover:underline mr-2">
              수정
            </button>
            <form th:action="@{'/admin/users/delete/' + ${user.username}}" method="post"
                  onsubmit="return confirm('삭제하시겠습니까?');">
              <input type="hidden" name="_method" value="delete" />
              <button type="submit" class="text-red-500 hover:underline">삭제</button>
            </form>
          </td>
        </tr>
        </tbody>

      </table>
    </div>
    <!-- 페이지 네이션용 -->
    <nav aria-label="Page navigation">
      <th:block th:if="${totalPages != null and totalPages > 1}">
        <ul class="flex justify-center mt-6 space-x-2">

          <!-- 이전 페이지 -->
          <li>
            <a th:if="${hasPrevious}"
               th:href="@{/admin/user(page=${number - 1})}"
               class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 transition">
              &laquo; 이전
            </a>
            <span th:unless="${hasPrevious}" class="px-3 py-1 text-gray-400">&laquo; 이전</span>
          </li>

          <!-- 다음 페이지 -->
          <li>
            <a th:if="${hasNext}"
               th:href="@{/admin/user(page=${number + 1})}"
               class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 transition">
              다음 &raquo;
            </a>
            <span th:unless="${hasNext}" class="px-3 py-1 text-gray-400">다음 &raquo;</span>
          </li>

        </ul>
      </th:block>
    </nav>

  </div>
</div>
