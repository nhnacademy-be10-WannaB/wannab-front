<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout (
      '휴면 계정 인증',
      ~{::body},
      ~{::head},
      false
    )}">

<head>
  <title>휴면 계정 인증</title>
  <link rel="stylesheet" th:href="@{/css/auth/unlock.css}">
</head>

<body>
<section class="reactivate-wrapper">
  <div class="reactivate-box">
    <!-- 계정 활성화 폼 -->
    <h2>휴면 계정 인증</h2>
    <p>보안을 위해 본인 인증이 필요합니다.<br />Dooray Messenger를 이용해 인증을 완료해주세요.</p>
    <form th:action="@{/auth/unlock/verify}" method="post" id="reactivate-form">
      <input type="hidden" name="userId" th:value="${userId}" />
      <label for="auth-code">인증 코드</label>
      <input type="text" id="auth-code" name="authCode" placeholder="6자리 숫자" required maxlength="6" />
      <button type="submit">계정 활성화</button>
      <p th:if="${error}" th:text="${error}" style="color:red;"></p>
    </form>

    <!-- 인증 코드 재전송 버튼 -->
    <div style="margin-top: 10px;">
      <button class="resend-button" type="button" id="resendBtn" th:data-user-id="${userId}">인증 코드 전송</button>
      <p id="resendMessage"></p>
    </div>

  </div>

</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const btn = document.getElementById("resendBtn");
    btn.addEventListener("click", function () {
      const userId = btn.dataset.userId;

      fetch('/auth/unlock/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ userId })
      })
              .then(response => {
                const msg = document.getElementById('resendMessage');
                if (response.ok) {
                  msg.innerText = '인증 코드가 재전송되었습니다.';
                  msg.style.color = 'green';
                } else {
                  msg.innerText = '전송에 실패했습니다.';
                  msg.style.color = 'red';
                }
              });
    });
  });
</script>
</body>
</html>
