<div th:fragment="mypageSidebar" class="mypage-sidebar">
    <h2>My Page</h2>
    <div class="mypage-user">
        <strong th:text="${user.name}"></strong>
        <span class="member-grade" th:text="${user.grade}"></span>
    </div>
    <ul class="mypage-stats"
        th:onclick="|window.location.href='@{/user/mypage-point-histories}'|">
        <li>Point <strong th:text="${user.points}">312P</strong></li>
    </ul>
    <ul class="mypage-menu" id="mypageMenu">
        <li th:classappend="${currentUri == '/user/mypage'} ? 'active'"
            th:onclick="|window.location.href='@{/user/mypage}'|">회원 정보 수정</li>
        <li th:classappend="${currentUri == '/user/mypage-address'} ? 'active'"
            th:onclick="|window.location.href='@{/user/mypage-address}'|">주소 수정</li>
        <li th:classappend="${currentUri == '/user/mypage-order'} ? 'active'"
            th:onclick="|window.location.href='@{/user/mypage-order}'|">주문내역</li>
        <li th:classappend="${currentUri == '/user/mypage-liked'} ? 'active'"
            th:onclick="|window.location.href='@{/user/mypage-liked}'|">좋아요한 상품</li>
        <li th:classappend="${currentUri == '/user/mypage-review'} ? 'active'"
            th:onclick="|window.location.href='@{/user/mypage-review}'|">내 도서 리뷰</li>
        <li th:classappend="${currentUri == '/user/mypage-point-histories'} ? 'active'"
            th:onclick="|window.location.href='@{/user/mypage-point-histories}'|">포인트 내역</li>
        <li th:classappend="${currentUri == '/user/mypage-coupon'} ? 'active'"
            th:onclick="|window.location.href='@{/user/mypage-coupon}'|">내 쿠폰함</li>
    </ul>
    <form action="/users" method="post" onsubmit="return confirmDelete()">
        <input type="hidden" name="_method" value="delete">
        <button type="submit" class="leave-btn">회원 탈퇴</button>
    </form>
    <script>
        function confirmDelete() {
            return confirm("정말 회원 탈퇴하시겠습니까?\n이 작업은 되돌릴 수 없습니다.");
        }
    </script>
</div>
