<!-- ✅ Updated HTML: main-order.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout (
      '주문 페이지',
      ~{::body},
      ~{::head},
      true
    )}">

<head>
  <title>주문 페이지</title>
  <link rel="stylesheet" th:href="@{/css/user/main-order.css}" />
</head>

<body th:data-client-key="${clientKey}">
<div class="order-wrapper">
  <section class="order-section">
    <h2 class="order-title">🧾 Check & Order</h2>
    <p class="order-sub">결제 진행</p>

    <form id="order-form" th:action="@{/main-order/submit}" method="post">
      <div class="order-container">
        <div class="order-main">
          <!-- 상품 목록 -->
          <div class="order-items">
            <table class="order-table">
              <thead>
              <tr>
                <th>상품</th>
                <th>수량</th>
                <th>판매가</th>
                <th>포장지</th>
                <th>쿠폰</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="book, iterStat : ${orderBookInfos}">
                <td>
                  <div class="order-product">
                    <img th:src="${book.thumbnailUrl}" />
                    <div class="order-product-info">
                      <strong th:text="${book.title}">책 제목</strong>
                    </div>
                  </div>
                  <input type="hidden" th:name="'bookOrderSubmitDtos[' + ${iterStat.index} + '].bookId'" th:value="${book.bookId}" />
                  <input type="hidden" th:name="'bookOrderSubmitDtos[' + ${iterStat.index} + '].bookSalesPrice'" th:value="${book.salesPrice}" />
                  <input type="hidden" th:name="'bookOrderSubmitDtos[' + ${iterStat.index} + '].bookQuantity'" th:value="${book.quantity}" />
                </td>
                <td th:text="${book.quantity}">1</td>
                <td th:text="|${#numbers.formatInteger(book.salesPrice, 3, 'COMMA')}원|">0원</td>

                <td>
                    <div class="wrap-coupon-row">
                  <!-- 포장지 -->
                  <select th:name="'bookOrderSubmitDtos[' + ${iterStat.index} + '].pavingId'"
                          th:id="'wpSelect' + ${iterStat.index}"
                          th:attr="data-index=${iterStat.index}">
                    <option value="0" data-price="0">포장지 선택 안함</option>
                    <option th:each="paving : ${pavingList}"
                            th:value="${paving.id}"
                            th:attr="data-price=${paving.price}"
                            th:text="${paving.name + ' (+ ' + #numbers.formatInteger(paving.price, 3, 'COMMA') + '원)'}">
                    </option>
                  </select>

                  <!-- ✅ 도서별 쿠폰 -->
                  <select class="book-coupon-select"
                          th:name="'bookOrderSubmitDtos[' + ${iterStat.index} + '].appliedCouponId'"
                          th:attr="data-base-price=${book.salesPrice}">
                    <option value="" data-discount-value="0" data-discount-type="FIXED">쿠폰 선택 안함</option>
                    <option th:each="cp : ${book.applicableCoupons}"
                            th:value="${cp.couponId}"
                            th:attr="data-discount-value=${cp.discountValue}, data-discount-type=${cp.discountType.name()}"
                            th:text="${cp.couponName + ' (- ' + cp.discountValue + (cp.discountType.name() == 'PERCENT' ? '%' : '원') + ')'}">
                    </option>
                  </select>


                  <input type="hidden" th:id="'pvPriceInput' + ${iterStat.index}"
                         th:name="'bookOrderSubmitDtos[' + ${iterStat.index} + '].pavingPaperPrice'" value="0" />
                  </div>
                </td>

              </tr>
              </tbody>
            </table>
          </div>

          <!-- ✅ 주문 전체에 적용되는 쿠폰 선택 -->
          <div class="order-discount" th:if="${userId >= 0}">
            <h4>전체 쿠폰 선택</h4>
            <select name="appliedOrderCouponId" id="orderCouponSelect">
              <option value="" data-discount-value="0" data-discount-type="FIXED">쿠폰 선택 안함</option>
              <option th:each="cp : ${orderCoupons}"
                      th:value="${cp.couponId}"
                      th:attr="data-discount-value=${cp.discountValue}, data-discount-type=${cp.discountType.name()}"
                      th:text="${cp.couponName + ' (- ' + cp.discountValue + (cp.discountType.name() == 'PERCENT' ? '%' : '원') + ')'}">
              </option>
            </select>
          </div>

          <!-- ✅ 포인트 사용 -->
          <div th:if="${userId >= 0}" class="order-discount">
            <h4>포인트 사용</h4>
            <input type="number" id="usedPointsInput" name="usedPoints" min="0" placeholder="0" th:attr="max=${userPoints}" />
            <p th:text="|보유 포인트: ${userPoints}P|">보유 포인트: 0P</p>
          </div>



          <div class="order-recipient-info">
            <fieldset class="delivery-info-box">
              <legend>정보 입력</legend>
              <div class="input-group">
                <input type="text" name="recipientName" placeholder="받는분 이름을 입력해주세요" maxlength="10" required />
              </div>
              <div class="input-group">
                <input type="email" name="email" placeholder="이메일 주소를 입력해주세요" required />
              </div>
              <div class="input-group">
                <input type="tel" id="recipientPhoneNumber" name="recipientPhoneNumber" maxlength="13" placeholder="010-1234-5678" required />
              </div>
              <p class="guide-text">입력하신 정보로 주문 관련 문자 및 메일이 발송됩니다.</p>
            </fieldset>

            <fieldset class="delivery-info-box">
              <legend>배송지 정보</legend>

              <input type="hidden" name="recipientAddress" id="recipientAddressHidden" required />

               <!-- 회원 주소 선택 -->
              <div th:if="${userId > 0}">
                <label for="addressSelect">주소 선택</label>
                <select id="addressSelect">
                  <option value="">직접 입력</option>
                  <option th:each="addr : ${userAddressList}"
                          th:value="${addr.address + ' ' + addr.detailAddress}"
                          th:attr="data-full-address=${addr.address + ' ' + addr.detailAddress}"
                          th:text="'[' + ${addr.addressName} + '] ' + ${addr.address} + ' ' + ${addr.detailAddress}">
                  </option>
                </select>
              </div>

              <!-- 직접입력 input -->
              <input type="text" id="manualAddressInput" placeholder="주소를 입력해주세요" style="display:none;" />

              <!--비회원 주소 입력-->
              <div th:if="${userId < 0}">
                <input type="text" name="recipientAddress" placeholder="주소를 입력해주세요" required />
              </div>
            </fieldset>

          </div>

          <!-- 비회원일 경우 -->
          <div th:if="${userId < 0}" class="guest-info-section">
            <fieldset class="guest-info-box">
              <div class="password-section">
                <strong>주문조회 비밀번호 입력</strong>
                <input type="password" name="guestPassword" placeholder="비밀번호를 입력해주세요." required />
              </div>
            </fieldset>
          </div>

          <!-- 희망 배송 날짜 -->
          <div class="delivery-date">
            <h4>희망 배송 날짜</h4>
            <input type="date" name="deliveryRequestAt" />
          </div>


        </div>

        <!-- 주문 요약 -->
        <div class="order-summary">
          <p>주문금액: <span th:text="|${#numbers.formatInteger(totalBookPrice, 3, 'COMMA')}원|">0원</span></p>
          <p>쿠폰할인: <span class="minus" id="couponDiscountDisplay">-0원</span></p>
          <p>포인트: <span class="minus" id="usedPointsDisplay">-0원</span></p>
          <p>포장지: <span class="plus" id="pavingPriceDisplay">+0원</span></p>
          <p>배송비: <span class="plus" th:text="|+ ${#numbers.formatInteger(shippingFee, 3, 'COMMA')}원|">+0원</span></p>
          <p class="summary-total">
            결제예정금액:
            <strong id="finalAmountDisplay" th:text="|${#numbers.formatInteger(totalBookPrice + shippingFee, 3, 'COMMA')}원|">0원</strong>
          </p>
          <button id="payment-button" class="order-btn" type="button">결제 하기</button>
        </div>
      </div>
    </form>
  </section>
</div>

<script th:inline="javascript">
  let totalBookPrice = /*[[${totalBookPrice != null ? totalBookPrice : 0}]]*/ 0;
  let shippingFee = /*[[${shippingFee != null ? shippingFee : 0}]]*/ 0;
</script>
<script src="https://js.tosspayments.com/v2/standard"></script>

<script th:src="@{/js/main-order.js}"></script>

<script>
  const phoneInput = document.getElementById("recipientPhoneNumber");
  phoneInput.addEventListener("input", function (e) {
    let value = e.target.value.replace(/\D/g, ""); // 숫자만 남김

    if (value.length > 3 && value.length <= 7) {
      value = value.replace(/(\d{3})(\d+)/, "$1-$2");
    } else if (value.length > 7) {
      value = value.replace(/(\d{3})(\d{4})(\d+)/, "$1-$2-$3");
    }

    e.target.value = value;
  });
</script>

</body>
</html>
