<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout (
      '마이 페이지',
      ~{::body},
      ~{::head},
      false
    )}">

<head>
  <title>마이 페이지</title>
  <link rel="stylesheet" th:href="@{/css/user/mypage-order.css}" />
  <script th:src="@{/js/mypage.js}"></script>
</head>

<body>
<div class="mypage-wrapper">
  <!-- 사이드바 -->
  <div th:replace="~{components/mypage-sidebar :: mypageSidebar}"></div>

  <!-- 주문 내역 본문 -->
  <section class="mypage-content">
    <h3>주문 내역</h3>

    <div th:if="${#lists.isEmpty(orders)}" class="text-gray-500">주문 내역이 없습니다.</div>

    <div th:each="order : ${orders}" class="order-card">
      <div class="order-product">
        <img th:src="${order.thumbnailUrl}" alt="book cover" />
        <div class="order-info">
          <small th:text="${#temporals.format(order.orderAt, 'yyyy-MM-dd HH:mm')}">주문일시</small>
          <strong th:text="'[주문번호] ' + ${order.orderId}"></strong><br />
          <span th:text="'총 금액: ' + ${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'"></span><br />
          <span th:switch="${order.orderStatus.name()}">
            <span th:case="'PENDING'" class="text-gray-500">결제대기</span>
            <span th:case="'PAID'" class="text-blue-600">결제완료(배송대기)</span>
            <span th:case="'SHIPPING'" class="text-green-600">배송중</span>
            <span th:case="'COMPLETED'" class="text-gray-800">배송 완료</span>
            <span th:case="'RETURNED'" class="text-red-500">반품</span>
            <span th:case="'CANCELLED'" class="text-orange-500">주문취소</span>
            <span th:case="*" class="text-yellow-500">알 수 없음</span>
          </span>
        </div>
      </div>
      <div class="order-meta">
        <p th:if="${order.shippedAt != null}"
           th:text="'출고일 : ' + ${#temporals.format(order.shippedAt, 'yyyy-MM-dd HH:mm')}"></p>
        <p th:unless="${order.shippedAt != null}"
           th:text="'출고일 : 출고대기중'"></p>
        <p>
          <a th:href="@{/user/mypage-order-detail(orderId=${order.orderId})}" class="detail">상세 보기</a>
          <span class="return text-xs text-yellow-600 cursor-pointer"
                th:if="${order.orderStatus.name() == 'COMPLETED'}"
                th:attr="data-order-id=${order.orderId}"
                onclick="openRefundModal(this)">반품
          </span>
          <span class="cancel text-xs text-red-500 cursor-pointer"
                th:if="${order.orderStatus.name() == 'PAID'}"
                th:attr="data-order-id=${order.orderId}"
                onclick="submitCancel(this)">
              주문 취소
          </span>
        </p>
      </div>
    </div>
  </section>
</div>

<!--주문취소-->
<form id="cancel-form" method="post" th:action="@{/user/mypage-order/cancel}">
  <input type="hidden" name="orderId" id="cancel-order-id" />
</form>

<!--반품모달-->
<div class="modal-overlay" id="refund-modal" style="display: none;">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal('refund-modal')">&times;</span>
    <h2>반품 요청</h2>
    <form method="post" th:action="@{/user/mypage-order/refund}">
      <input type="hidden" name="orderId" id="refund-order-id" />
      <label>반품 사유 선택</label>
      <select name="reason" required>
        <option value="">선택하세요</option>
        <option value="JUST">단순변심</option>
        <option value="DAMAGED">상품파손</option>
      </select><br /><br />
      <button type="submit" class="btn-submit">반품 요청</button>
    </form>
  </div>
</div>


<script>
  // 반품 모달 열기
  function openRefundModal(el) {
    const orderId = el.getAttribute('data-order-id');
    document.getElementById('refund-order-id').value = orderId;
    document.getElementById('refund-modal').style.display = 'block';
  }

  // 리뷰 모달 열기 (기존 사용중인 함수)
  function openModal(id) {
    document.getElementById(id).style.display = 'block';
  }

  // 모달 닫기
  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  //취소에 대한 orderId 받기
  function submitCancel(el) {
    const orderId = el.getAttribute('data-order-id');
    document.getElementById('cancel-order-id').value = orderId;
    document.getElementById('cancel-form').submit();
  }
</script>

</body>



</html>
