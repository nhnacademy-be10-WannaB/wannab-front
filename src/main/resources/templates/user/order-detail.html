<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/user-layout :: layout (
      '주문 상세 페이지',
      ~{::body},
      ~{::head},
      false
    )}">

<head>
    <title>주문 상세</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">
<div class="max-w-5xl mx-auto px-6 py-10">
    <!-- 주문 정보 -->
    <section class="bg-white rounded-xl shadow p-6 mb-12 font-mono text-sm text-gray-800">
        <!-- 헤더 -->
        <div class="text-center border-b border-dashed pb-4 mb-6">
            <h2 class="text-lg font-bold tracking-wider">RECEIPT</h2>
            <p class="text-xs text-gray-500" th:text="${#temporals.format(order.orderAt, 'yyyy-MM-dd HH:mm')}">
                2025-07-07 12:00
            </p>
        </div>

        <!-- 고객명 -->
        <div class="mb-4 flex justify-between">
            <span>주문자성함</span>
            <span th:text="${order.name}">주문자 성함</span>
        </div>

        <!-- 주문번호 -->
        <div class="mb-4 flex justify-between">
            <span>주문번호</span>
            <span th:text="${order.orderId}">#1001</span>
        </div>

        <!-- 주문 상태 -->
        <div class="mb-4 flex justify-between">
            <span>주문상태</span>
            <span th:switch="${order.orderStatus.name()}">
                    <span th:case="'PENDING'" class="text-gray-500">결제대기</span>
                    <span th:case="'PAID'" class="text-blue-600">결제완료(배송대기)</span>
                    <span th:case="'SHIPPING'" class="text-green-600">배송중</span>
                    <span th:case="'COMPLETED'" class="text-gray-800">배송 완료</span>
                    <span th:case="'RETURNED'" class="text-red-500">반품</span>
                    <span th:case="'CANCELLED'" class="text-orange-500">주문취소</span>
                    <span th:case="'FAILED'" class="text-red-500">주문실패</span>
                    <span th:case="*" class="text-yellow-500">알 수 없음</span>
            </span>

        </div>
        <!-- 비회원 버튼 (조건부 출력) -->
        <div class="mt-2 flex gap-2 justify-end">
            <button
                    type="button"
                    th:if="${isGuest and order.orderStatus.name() == 'PAID'}"
                    th:attr="data-order-id=${order.orderId}"
                    class="text-xs px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded-md transition"
                    onclick="openPasswordModal(this)">
                주문 취소
            </button>

            <button
                    type="button"
                    th:if="${isGuest and order.orderStatus.name() == 'COMPLETED'}"
                    th:attr="data-order-id=${order.orderId}"
                    class="text-xs px-3 py-1 bg-yellow-500 hover:bg-yellow-600 text-white rounded-md transition"
                    onclick="openRefundModal(this)">
                반품 요청
            </button>
        </div>


        <div class="border-t border-dashed my-4"></div>

        <!-- 금액 항목 -->
        <div class="space-y-2 mb-6">
            <!-- 할인 금액 -->
            <div class="flex justify-between">
                <span>할인 금액</span>
                <span class="text-blue-600" th:if="${order.totalDiscount == 0}">0원</span>
                <span class="text-blue-600" th:unless="${order.totalDiscount == 0}"
                      th:text="'-' + ${#numbers.formatInteger(order.totalDiscount, 3, 'COMMA')} + '원'">-1,000원</span>
            </div>

            <!-- 포장비 -->
            <div class="flex justify-between">
                <span>포장비</span>
                <span class="text-red-500" th:if="${order.totalWrappinpPrice == 0}">0원</span>
                <span class="text-red-500" th:unless="${order.totalWrappinpPrice == 0}"
                      th:text="'+' + ${#numbers.formatInteger(order.totalWrappinpPrice, 3, 'COMMA')} + '원'">+2,000원</span>
            </div>

            <!-- 배송비 -->
            <div class="flex justify-between">
                <span>배송비</span>
                <span class="text-red-500" th:if="${order.shippingFee == 0}">0원</span>
                <span class="text-red-500" th:unless="${order.shippingFee == 0}"
                      th:text="'+' + ${#numbers.formatInteger(order.shippingFee, 3, 'COMMA')} + '원'">+3,000원</span>
            </div>
        </div>

        <!-- 총합 강조 -->
        <div class="border-t border-double pt-3 mt-3 text-lg font-bold flex justify-between text-gray-900">
            <span>Total</span>
            <span th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'">12,000원</span>
        </div>

        <!-- 하단 메시지 -->
        <div class="text-center mt-8 text-xs text-gray-400 tracking-widest">
            THANK YOU FOR YOUR ORDER. From WannaB
        </div>
    </section>

    <!-- 도서 리스트 -->
    <section>
        <h2 class="text-2xl font-semibold mb-6">주문 상품</h2>
        <div class="space-y-4">
            <div class="flex items-center bg-white rounded-xl shadow-sm p-4" th:each="book : ${order.books}">
                <img th:src="${book.thumbnailUrl}" alt="thumbnail"
                     class="w-24 h-32 object-cover rounded-lg border" />
                <div class="ml-6 flex-1">
                    <h3 class="text-lg font-semibold text-gray-900" th:text="${book.title}">도서 제목</h3>
                    <p class="text-sm mt-2">수량: <span th:text="${book.quantity}">1</span>권</p>
                    <p class="text-sm text-rose-600 mt-1">총 가격:
                        <span th:text="${#numbers.formatInteger(book.bookTotalPrice, 3, 'COMMA')} + '원'">8,000원</span>
                    </p>
                    <!--리뷰작성-->
                    <button
                            type="button"
                            th:if="${order.orderStatus.name() == 'COMPLETED'}"
                            class="text-xs px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded"
                            th:attr="data-book-id=${book.bookId}, data-order-id=${order.orderId}, data-book-title=${book.title}"
                            onclick="openReviewModal(this)">
                        리뷰 작성
                    </button>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- 주문 취소용 비밀번호 입력 모달 -->
<div id="passwordModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-sm shadow-lg">
        <h3 class="text-lg font-semibold mb-4">비밀번호 확인</h3>
        <form id="guestCancelForm" method="post" action="">
            <input type="password" name="password" placeholder="비밀번호 입력"
                   class="w-full px-3 py-2 border rounded mb-4 focus:outline-none focus:ring focus:border-blue-300" required />
            <input type="hidden" name="orderId" id="orderIdInput" />
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closePasswordModal()"
                        class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-sm rounded">
                    취소
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm rounded">
                    확인
                </button>
            </div>
        </form>
    </div>
</div>

<!--반품모달-->
<!-- 반품 요청 모달 -->
<div id="refundModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md relative">
        <!-- 닫기 버튼 -->
        <button onclick="closeRefundModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl font-bold">
            &times;
        </button>

        <h2 class="text-lg font-semibold mb-4">반품 요청</h2>

        <form method="post" action="/guest/main-non-member-order-detail/refund" id="guestRefundForm">
            <!-- orderId hidden -->
            <input type="hidden" name="orderId" id="refundOrderIdInput" />

            <!-- 비밀번호 -->
            <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
            <input type="password" name="password" required
                   class="w-full mb-4 px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" placeholder="비밀번호 입력" />

            <!-- 반품 사유 -->
            <label class="block text-sm font-medium text-gray-700 mb-1">반품 사유</label>
            <select name="reason" required
                    class="w-full mb-4 px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300">
                <option value="">사유 선택</option>
                <option value="JUST">단순 변심</option>
                <option value="DAMAGED">상품 파손</option>
            </select>

            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeRefundModal()"
                        class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-sm rounded">
                    취소
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white text-sm rounded">
                    반품 요청
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 리뷰 작성 모달 -->
<div id="reviewModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-50">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md relative">
        <button onclick="closeReviewModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl font-bold">
            &times;
        </button>

        <h2 class="text-lg font-semibold mb-4" id="reviewBookTitle">리뷰 작성</h2>

        <form method="post" action="/user/mypage-review/register" id="reviewForm" enctype="multipart/form-data">
            <input type="hidden" name="bookId" id="reviewBookIdInput">
            <input type="hidden" name="orderId" id="reviewOrderIdInput">
            <input type="hidden" name="bookName" id="reviewBookTitleInput">

            <!--  별점 드롭다운 -->
            <label for="rating" class="block text-sm font-medium text-gray-700 mb-1">별점</label>
            <select name="rating" id="rating" required
                    class="w-full mb-4 px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300">
                <option value="">별점을 선택해주세요</option>
                <option value="5">⭐⭐⭐⭐⭐ (5점)</option>
                <option value="4">⭐⭐⭐⭐ (4점)</option>
                <option value="3">⭐⭐⭐ (3점)</option>
                <option value="2">⭐⭐ (2점)</option>
                <option value="1">⭐ (1점)</option>
            </select>

            <!-- 이미지 업로드 -->
            <label class="relative cursor-pointer px-4 py-2 bg-gray-200 text-gray-800 text-sm rounded hover:bg-gray-300">
                이미지 선택
                <input type="file" id="reviewImageInput" name="reviewImages" accept="image/*" multiple class="hidden" />
            </label>
            <div id="reviewImagePreview" class="grid grid-cols-4 gap-2 mt-4"></div>

            <!-- ✍ 리뷰 내용 -->
            <label class="block text-sm font-medium text-gray-700 mb-1">리뷰 내용</label>
            <textarea name="content" required rows="4"
                      class="w-full mb-4 px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300"
                      placeholder="리뷰를 작성해주세요."></textarea>

            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeReviewModal()"
                        class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-sm rounded">
                    취소
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm rounded">
                    등록
                </button>
            </div>
        </form>
    </div>
</div>


<!--주문취소용 스크립트-->
<script>
    function openPasswordModal(button) {
        const orderId = button.getAttribute('data-order-id');
        document.getElementById('orderIdInput').value = orderId;
        document.getElementById('guestCancelForm').action = `/guest/main-non-member-order-detail/cancel`;
        document.getElementById('passwordModal').classList.remove('hidden');
    }

    function closePasswordModal() {
        document.getElementById('passwordModal').classList.add('hidden');
        document.getElementById('guestCancelForm').reset();
    }
</script>

<script>
    // 모달 열기
    function openRefundModal(button) {
        const orderId = button.getAttribute('data-order-id');
        document.getElementById('refundOrderIdInput').value = orderId;
        document.getElementById('refundModal').classList.remove('hidden');
    }

    // 모달 닫기
    function closeRefundModal() {
        const modal = document.getElementById('refundModal');
        modal.classList.add('hidden');
        document.getElementById('guestRefundForm').reset();
    }
</script>

<script>
    function openReviewModal(button) {
        const bookId = button.getAttribute('data-book-id');
        const orderId = button.getAttribute('data-order-id');
        const bookTitle = button.getAttribute('data-book-title');

        document.getElementById('reviewBookIdInput').value = bookId;
        document.getElementById('reviewOrderIdInput').value = orderId;
        document.getElementById('reviewBookTitleInput').value = bookTitle;
        document.getElementById('reviewBookTitle').innerText = `"${bookTitle}" 리뷰 작성`;

        document.getElementById('reviewModal').classList.remove('hidden');
    }

    function closeReviewModal() {
        document.getElementById('reviewModal').classList.add('hidden');
        document.getElementById('reviewForm').reset();
    }
</script>
<script>
    const reviewImageInput = document.getElementById('reviewImageInput');
    const reviewImagePreview = document.getElementById('reviewImagePreview');
    let selectedReviewImages = [];

    reviewImageInput.addEventListener('change', function () {
        const files = Array.from(reviewImageInput.files);

        files.forEach(file => {
            if (!file.type.startsWith('image/')) return;

            const id = Date.now() + Math.random();
            selectedReviewImages.push({ id, file });

            const reader = new FileReader();
            reader.onload = function (e) {
                const wrapper = document.createElement('div');
                wrapper.className = "relative group";

                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = "w-full h-32 object-cover rounded border border-gray-300";

                const fileName = document.createElement('p');
                fileName.textContent = file.name;
                fileName.className = "text-sm mt-1 text-center truncate";

                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '✕';
                deleteBtn.className = "absolute top-1 right-1 bg-white text-red-500 rounded-full text-xs px-2 py-0.5 shadow";
                deleteBtn.onclick = function () {
                    selectedReviewImages = selectedReviewImages.filter(f => f.id !== id);
                    wrapper.remove();
                    refreshReviewImageInput();
                };

                wrapper.appendChild(img);
                wrapper.appendChild(deleteBtn);
                wrapper.appendChild(fileName);
                reviewImagePreview.appendChild(wrapper);
            };
            reader.readAsDataURL(file);
        });

        refreshReviewImageInput();
    });

    function refreshReviewImageInput() {
        const dataTransfer = new DataTransfer();
        selectedReviewImages.forEach(f => dataTransfer.items.add(f.file));
        reviewImageInput.files = dataTransfer.files;
    }
</script>

</body>

</html>
