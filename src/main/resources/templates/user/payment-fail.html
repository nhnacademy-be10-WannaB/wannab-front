<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>결제 실패</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .container { background-color: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        h2 { color: #dc3545; /* 실패를 의미하는 붉은색 */ margin-bottom: 20px; }
        p { font-size: 1.1em; color: #555; margin-bottom: 10px; }
        .highlight { font-weight: bold; color: #333; }
        .error-details { background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 15px; border-radius: 5px; margin-top: 20px; text-align: left; }
        .error-details p { margin-bottom: 5px; }
        .back-button { display: inline-block; margin-top: 30px; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; transition: background-color 0.3s ease; }
        .back-button:hover { background-color: #5a6268; }
    </style>
</head>
<body>
<div class="container">
    <h2>❌ 결제 실패 ❌</h2>
    <p>결제를 완료하지 못했습니다. 아래 내용을 확인해주세요.</p>

    <div th:if="${failInfo}">
        <p><strong>오류 코드:</strong> <span th:text="${failInfo.errorCode}"></span></p>
        <p><strong>오류 메시지:</strong> <span th:text="${failInfo.errorMessage}"></span></p>
        <p th:if="${failInfo.orderId}"><strong>주문 번호:</strong> <span th:text="${failInfo.orderId}"></span></p>
        <p th:if="${failInfo.paymentKey}"><strong>결제 키:</strong> <span th:text="${failInfo.paymentKey}"></span></p>
    </div>
    <div th:unless="${failInfo}">
        <p>상세 오류 정보를 불러올 수 없습니다.</p>
    </div>

    <a class="back-button" href="/">메인 페이지로 돌아가기</a>
</div>
</body>
</html>
